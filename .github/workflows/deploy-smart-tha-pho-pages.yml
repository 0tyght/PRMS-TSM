name: Deploy Smart Tha Pho to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API and shared tests
        run: npm test

      - name: Copy runtime configuration
        run: |
          for app in portal prms-tsm waste-management disaster-management waterworks-management; do
            mkdir -p "apps/$app/public"
            cp runtime-config.json "apps/$app/public/runtime-config.json"
          done

      - name: Build municipal web applications
        run: npm run build

      - name: Assemble Smart Tha Pho website
        run: |
          mkdir -p site
          cp -R apps/portal/dist/. site/
          for app in prms-tsm waste-management disaster-management waterworks-management; do
            mkdir -p "site/$app"
            cp -R "apps/$app/dist/." "site/$app/"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
